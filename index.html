          <li><span>Great</span><b id="r-gr">0</b></li>
          <li><span>Good</span><b id="r-gd">0</b></li>
          <li><span>Miss</span><b id="r-ms">0</b></li>
        </ul>
        <button type="button" id="btn-again">再奏一次</button>
        <button type="button" id="btn-back" class="ghost">返回曲目</button>
      </div>
    </div>
  </section>

# Rhythm Chart Maker

Build a playable song pack for the Monument Rhythm HTML page from one audio file. Do not invent a second chart schema.

## When this skill runs

1. The user attached or named an audio file.
2. The user asked for a chart / 谱面 / 游玩文件 / beatmap / zip for Monument Rhythm or 节奏大师-style play.

If no audio is present, ask for a file (mp3, wav, ogg, m4a, flac) and stop.

## Output contract

Each song is one folder. Then zip the folder for the webpage upload button.

```
<slug>/
  <audio-filename>
  chart.json
```

Never put two songs in one folder. The webpage has no central song index. The zip is the pack.

## chart.json

```json
{
  "version": 1,
  "title": "Song Title",
  "artist": "Artist",
  "audio": "audio.mp3",
  "duration": 180.0,
  "bpm": 120,
  "offset": 0.0,
  "lanes": 4,
  "difficulty": "normal",
  "preview": 8.0,
  "notes": [
    { "t": 1.25, "lane": 0, "type": "tap" },
    { "t": 4.00, "lane": 2, "type": "hold", "end": 5.50 }
  ]
}
```

Rules:

- `t` is seconds from audio time zero.
- `lane` is 0 to lanes-1, left to right.
- Notes must be sorted by `t`.
- Two notes may share the same `t` only on different lanes.
- Hold `end` must be greater than `t` by at least 0.18 s.
- `offset` shifts every note at load time. Positive delays notes.
- Prefer mp3 so mobile Safari can play the file.

## Procedure

1. Copy the source audio into a working path the sandbox can read.
2. Detect onsets (spectral flux or equivalent). Keep a playable density.
3. Map onsets onto 4 lanes. Avoid repeating the same lane back to back unless the difficulty is easy.
4. Write `chart.json` next to the audio. Confirm `notes` is not empty.
5. Zip the folder:

```
zip -r <slug>.zip <slug>
```

The zip may contain one song folder or several. Tell the user to press 上传曲包 on the Monument Rhythm page. The page stores the pack in the browser.

Difficulty when the user names one — easy / normal / hard. Default normal. Lanes default to 4. Title defaults to the audio stem. Artist defaults to Unknown.

## Manual repair

If notes are early or late, edit `offset` in chart.json. If density is wrong, regenerate at another difficulty. Do not hand-place hundreds of notes unless the user asked for a short custom pattern.
